<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tiny House Games</title>
<meta name="description" content="Small games, made in a tiny house.">
<style>
html{background:linear-gradient(135deg,#0d1030,#1a0d2e 50%,#0b2a2a)}
body{font-family:ui-rounded,'SF Pro Rounded','Nunito','Quicksand','Comic Neue',system-ui,sans-serif;color:#f6f0e4;margin:0;min-height:100vh;display:flex;flex-direction:column;text-shadow:0 1px 3px rgba(0,0,0,.6)}
#aurora{position:fixed;inset:0;width:100%;height:100%;z-index:-1;display:block}
.no-gl #aurora{display:none}
a{color:#ffc47a}
.wob{display:inline-block;transform:rotate(-1.5deg)}
nav{display:flex;justify-content:center;gap:.4rem;padding:1rem;flex-wrap:wrap}
nav a,.pill{color:#f6f0e4;text-decoration:none;padding:.4rem .95rem;border-radius:999px 999px 999px 999px/60% 80% 70% 90%;border:1.5px solid rgba(255,196,122,.45);background:rgba(255,170,90,.12);font-size:.9rem}
nav a:hover,.pill:hover{background:rgba(255,170,90,.28);transform:rotate(-2deg)}
nav a,.pill{display:inline-block;transition:transform .2s,background .2s}
.pill{font-size:1rem;padding:.55rem 1.2rem;background:rgba(255,170,90,.22)}
main{flex:1;display:grid;place-items:center;padding:1rem}
main>section{display:none;width:100%;max-width:60rem;text-align:center}
main>section:target,#home{display:block}
section:target~#home{display:none}
h1{font-size:clamp(2.4rem,7vw,4.5rem);margin:0;letter-spacing:.01em;color:#fff1dc;text-shadow:0 2px 0 rgba(120,60,20,.35),0 0 24px rgba(255,180,100,.35)}
.tag{font-size:clamp(1rem,2.4vw,1.3rem);opacity:.9;margin:.4rem 0 1.6rem}
h2{font-size:1.6rem;margin:0 0 1rem;color:#ffd9a8}
.glass,.game-card{background:rgba(14,12,24,.55);border:1.5px solid rgba(255,196,122,.3);border-radius:22px 18px 24px 16px}
@supports ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){.glass,.game-card{background:rgba(60,30,20,.18);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}}
#games-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,260px));justify-content:center;gap:1rem;text-align:left}
.game-card:nth-child(odd){transform:rotate(-.8deg)}.game-card:nth-child(even){transform:rotate(.7deg)}
.game-card{display:flex;flex-direction:column;gap:.45rem;padding:.8rem}
.game-card__img{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:14px 12px 16px 10px}
.game-card__tile{aspect-ratio:16/9;display:grid;place-items:center;border-radius:14px 12px 16px 10px;border:2px dashed rgba(255,196,122,.45);background:rgba(255,170,90,.08);font-size:1rem;color:#ffd9a8}
.game-card__title{margin:0;font-size:1rem}
.game-card__blurb{margin:0;font-size:.88rem;line-height:1.45;opacity:.9}
.game-card__link{margin-top:auto;font-size:.9rem}
.games-empty{margin:0;opacity:.9}
.glass{display:inline-block;max-width:34rem;padding:1rem 1.4rem;line-height:1.55}
.glass p{margin:0}
</style>
<link rel="icon" href="/favicon.ico" sizes="any"><link rel="icon" type="image/png" href="/favicon-32.png"><link rel="apple-touch-icon" href="/apple-touch-icon.png"></head><body><canvas id="aurora" aria-hidden="true"></canvas>
<nav aria-label="Main"><a href="#home">🏠 home</a><a href="#games">🎲 games</a><a href="#about">👋 about</a></nav>
<main>
<section id="games" aria-labelledby="games-heading"><h2 id="games-heading"><span class="wob">What's cooking</span></h2>
<div id="games-list"><noscript><p class="games-empty">Coming soon.</p></noscript></div></section>
<section id="about" aria-labelledby="about-heading"><h2 id="about-heading"><span class="wob">Hi there!</span></h2>
<div class="glass"><p>Small, warm, slightly weird games, made in an actual tiny house.</p>
<p>Not much to show yet, but things are being tinkered with. Mind the low ceiling.</p></div></section>
<section id="home"><h1>Tiny House Games</h1><p class="tag">Small, cozy games, hand-made in a tiny house.</p>
<a class="pill" href="https://ko-fi.com/nathonlo">☕ buy us a coffee on Ko-fi</a></section>
</main>
<script src="aurora.js" defer></script>
<script type="module" src="games.js"></script>
</body></html>
